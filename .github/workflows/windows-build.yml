name: Windows x64 build

on:
  push:
    paths:
      - 'melonDS-korean-source.zip'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-enet
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-faad2
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-multimedia

      - name: Extract Korean source
        shell: pwsh
        run: |
          if (!(Test-Path "melonDS-korean-source.zip")) {
            throw "Upload melonDS-korean-source.zip to the repository root first."
          }
          Expand-Archive -Path "melonDS-korean-source.zip" -DestinationPath "source" -Force
          $src = Join-Path $PWD "source/melonDS-korean"
          if (!(Test-Path (Join-Path $src "CMakeLists.txt"))) {
            throw "The ZIP does not contain melonDS-korean/CMakeLists.txt."
          }
          # Compare every translated form with upstream and restore all Qt class identifiers.
          git clone --depth 1 https://github.com/melonDS-emu/melonDS.git upstream
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch upstream melonDS UI definitions." }
          $upstream = Join-Path $PWD "upstream"
          $repairScript = @'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(sys.argv[1])
          upstream = pathlib.Path(sys.argv[2])
          ui_files = list(root.rglob("*.ui"))
          if not ui_files:
              raise RuntimeError("No Qt Designer .ui files found")

          for path in ui_files:
              relative = path.relative_to(root)
              original_path = upstream / relative
              if not original_path.exists():
                  raise RuntimeError(f"Missing upstream reference UI: {relative}")
              tree = ET.parse(path)
              original_tree = ET.parse(original_path)
              translated_nodes = list(tree.getroot().iter())
              original_nodes = list(original_tree.getroot().iter())
              if len(translated_nodes) != len(original_nodes):
                  raise RuntimeError(f"UI structure differs from upstream: {relative}")
              for translated, original in zip(translated_nodes, original_nodes):
                  if translated.tag != original.tag:
                      raise RuntimeError(f"UI element order differs from upstream: {relative}")
                  for attribute in ("class", "name"):
                      if attribute in original.attrib:
                          translated.set(attribute, original.attrib[attribute])
                  # Only Qt <string> elements contain user-facing text.
                  # Restore every other XML text node (enum/set/tabstop/etc.)
                  # because translating these corrupts generated C++ identifiers.
                  if translated.tag != "string":
                      translated.text = original.text
                      translated.tail = original.tail
              class_node = tree.getroot().find("class")
              if class_node is None:
                  raise RuntimeError(f"Missing /ui/class in {path}")
              class_node.text = path.stem
              tree.write(path, encoding="utf-8", xml_declaration=True)
              check = ET.parse(path).getroot()
              if check.findtext("class") != path.stem:
                  raise RuntimeError(f"Failed to restore form class in {path}")
              print(f"Restored Qt class identifiers: {relative}")

          print(f"Verified {len(ui_files)} Qt Designer UI files against upstream.")
          '@
          $repairPath = Join-Path $env:RUNNER_TEMP "repair_ui_classes.py"
          Set-Content -LiteralPath $repairPath -Value $repairScript -Encoding UTF8
          python $repairPath $src $upstream
          if ($LASTEXITCODE -ne 0) { throw "UI class repair script failed." }
          $audioUi = Join-Path $src "src/frontend/qt_sdl/AudioSettingsDialog.ui"
          [xml]$audioCheck = Get-Content -LiteralPath $audioUi -Raw -Encoding UTF8
          if ($audioCheck.SelectSingleNode('/ui/class').InnerText -ne 'AudioSettingsDialog') {
            throw "AudioSettingsDialog.ui class identifier was not repaired on disk."
          }
          Write-Host "Verified on disk: $($audioCheck.SelectSingleNode('/ui/class').InnerText)"
          "SOURCE_DIR=$src" >> $env:GITHUB_ENV

      - name: Configure
        shell: msys2 {0}
        run: cmake -S "$SOURCE_DIR" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Package portable folder
        shell: msys2 {0}
        run: |
          mkdir -p package
          cp build/melonDS.exe package/
          windeployqt6 --release --compiler-runtime --dir package package/melonDS.exe
          cp /ucrt64/bin/SDL2.dll /ucrt64/bin/libarchive-*.dll /ucrt64/bin/libenet-*.dll /ucrt64/bin/libzstd*.dll /ucrt64/bin/libfaad*.dll package/ 2>/dev/null || true
          python -c "import shutil; shutil.make_archive('melonDS-korean-windows-x64', 'zip', 'package')"

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-korean-windows-x64
          path: melonDS-korean-windows-x64.zip
          if-no-files-found: error
